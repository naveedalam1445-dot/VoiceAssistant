name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip project
        run: unzip VoiceAssistant.zip

      - name: Grant gradlew permission
        run: chmod +x VoiceAssistant/gradlew

      - name: Build APK
        run: cd VoiceAssistant && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAssistant-APK
          path: VoiceAssistant/app/build/outputs/apk/debug/app-debug.apkname: Build Android APK

