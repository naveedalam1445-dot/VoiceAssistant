name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: unzip VoiceAssistant.zip
      - run: chmod +x VoiceAssistant/gradlew
      - run: cd VoiceAssistant && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceAssistant-APK
          path: VoiceAssistant/app/build/outputs/apk/debug/app-debug.apk
